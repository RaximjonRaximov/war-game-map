<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dunyo Urushi — Piyoda askar</title>
  <link rel="stylesheet" href="style.css?v=1" />
</head>
<body>
  <div id="ui">
    <div id="top-bar">
      <h1>Dunyo Urushi</h1>
      <div id="lobby">
        <label for="room-code">Xona:</label>
        <input id="room-code" type="text" value="default" />
        <button id="join-room">Qo'shil</button>
      </div>
      <div id="status">Ulanmoqda...</div>
    </div>
    <div id="instructions">WASD / strelkalar — harakatlanish. Sichqoncha — yo'nalish. SPACE yoki CLICK — o'q otish.</div>
    <div id="hud" class="hidden">
      <div id="health-wrap"><div id="health-bar"></div></div>
      <div id="stats">0 ta o'ldirish / 0 ta o'lim</div>
    </div>
    <div id="leaderboard"></div>
  </div>
  <canvas id="game"></canvas>
  <script src="game.js?v=1"></script>
</body>
</html>
