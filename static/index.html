<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>War Game Map — World Domination</title>
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
  <div id="app">
    <header>
      <h1>World War Map</h1>
      <div id="status">Connecting...</div>
      <button id="end-turn" class="hidden">End Turn</button>
      <button id="solo" class="hidden">Play vs AI</button>
      <button id="restart" class="hidden">Restart</button>
    </header>
    <canvas id="map" width="1600" height="896"></canvas>
    <div id="info">Open this page in two tabs to play together.</div>
    <div id="log"></div>
  </div>
  <script src="game.js?v=4"></script>
</body>
</html>
