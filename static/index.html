<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>War Game Map — World Domination</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="style.css?v=5" />
</head>
<body>
  <div id="app">
    <header>
      <h1>World War Map</h1>
      <div id="status">Connecting...</div>
      <button id="end-turn" class="hidden">End Turn</button>
      <button id="solo" class="hidden">Play vs AI</button>
      <button id="restart" class="hidden">Restart</button>
    </header>
    <div id="info">Open this page in two tabs to play together, or start a solo game vs AI.</div>
    <div id="map"></div>
    <div id="legend">
      <span><span class="dot" style="background:#1976d2"></span>You / allies</span>
      <span><span class="dot" style="background:#d32f2f"></span>Enemy</span>
      <span><span class="dot" style="background:#616161"></span>Neutral</span>
      <span><strong>Click</strong> a country to select, then click a connected enemy to attack.</span>
    </div>
    <div id="log"></div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="game.js?v=5"></script>
</body>
</html>
